# GitHub Actions —— BTH ADS-B 采集（公有仓库 = 免费无限分钟）
#
# 为什么是"长任务内的短窗口"：
#   单个 job 内部以 30 秒间隔轮询，每 10 分钟提交一次。**分辨率由 job 内的轮询
#   间隔（30 s）决定，与 job 时长无关**，所以把 job 缩短不会降低航迹分辨率，
#   只会让"每次失败/被延迟"的代价变小。
#
# 为什么从 6 小时改为 30 分钟（2026-10-11 实测后调整）：
#   旧配置 cron '17 */6' + '--max-minutes 350'，设计缺口每天仅 40 分钟。实测
#   10-10 04:38Z ~ 10-11 08:08Z 的 27.5 小时内只有约 55% 时间在采集，缺口共
#   12.5 小时，其中一次 7 小时 48 分。三个原因：
#     1. #3 任务被 runner 在 1h22m 处杀死（步骤显示 in_progress、job=failure，
#        说明是进程被外部终止，不是脚本报错——脚本吞掉所有异常并 return 0）。
#        一次失败就丢掉 5h50m 预算里的 4.5 小时。
#     2. GitHub 定时触发会延迟甚至丢弃：'18:17Z' 那一班实际 21:50Z 才起跑
#        （+3h33m），直接造成 7h48m 空洞。官方文档明确："some queued jobs may
#        be dropped"。
#     3. 6 小时周期只有 4 次触发机会，任何一次抖动都占 25% 的日覆盖。
#   改为每 30 分钟、每次跑 26 分钟后：设计缺口 ≤4 分钟，且**任何一次失败或
#   丢弃最多只损失 30 分钟**。触发机会 48 次/天，抖动被平均掉。
#
# 额度与限制依据（GitHub 官方文档 actions/reference/limits）：
#   - 公有仓库 + 标准 GitHub-hosted runner = 免费无限分钟 → 48 次/天无成本压力
#   - 私有仓库 GitHub Free 仅 2000 分钟/月；本方案每天约 1300 分钟 → 不够
#   - 最短 cron 间隔 5 分钟 → '*/30' 合法
#   - 单个 job 最长 6 小时 → 这里 26 分钟，余量极大
#   - 单个 workflow run 最长 35 天；并发 job（Free）上限 20 → 均远低于上限
#
# cron 为 5 位（分 时 日 月 周），按 **UTC** 解释。
#
# 定时任务的 60 天失活规则：
#   公有仓库 60 天无 commit 会自动停用定时触发。本流水线每 10 分钟自动提交一次，
#   天然不断刷新活动计时器，因此不受此规则影响。
#
# ⚠️ 存储上限（见 CLOUD_SETUP.md「能连续跑多久」一节）：
#   实测仓库膨胀约 17 MB/天（git 增量压缩后）。GitHub 建议仓库 <1 GB。
#   覆盖率提升到 ~87% 后估算约 25 MB/天 → 14 天约 350 MB，安全；但若长期
#   运行，仍需在触及 1 GB 前归档历史数据。
#
# 只需在 Settings → Secrets and variables → Actions 配置 Repository secrets：
#   OPENSKY_CLIENT_ID
#   OPENSKY_CLIENT_SECRET
# 推送无需额外配置：脚本自动使用内置 GITHUB_TOKEN。

name: bth-adsb-collect

on:
  schedule:
    # 每 30 分钟一次（UTC）。job 跑 26 分钟，留 4 分钟余量给 checkout/依赖安装。
    - cron: '*/30 * * * *'
  workflow_dispatch:          # 允许手动点一次立即验证

permissions:
  contents: write             # 必须，否则 GITHUB_TOKEN 无法推送数据

concurrency:
  # 同一时刻只允许一个采集器。用 queue 而不是 cancel：只有等当前 job 正常
  # 结束后下一个才启动，避免两个进程同时写同一个 DATA_BATCH 文件。
  group: bth-adsb-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 兜底：正常情况下 26 分钟结束，超时直接杀掉，免得占着 concurrency 槽位。
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Run collector (26m @ 30s, commit every 10m)
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_REF_NAME / GITHUB_RUN_ID are provided by Actions automatically.
          # The collector needs them: REF_NAME because a CI checkout is DETACHED
          # (rev-parse returns literal "HEAD", which silently breaks push), and
          # RUN_ID to name each commit window's files uniquely so concurrent
          # runs can never collide on the same CSV.
        run: python scripts/collect_longrun.py --interval 30 --max-minutes 26 --commit-every 10
