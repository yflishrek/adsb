# GitHub Actions —— BTH ADS-B 采集（公有仓库 = 免费无限分钟）
#
# 为什么用"长任务"：单个 job 内部以 30 秒间隔循环 5 小时，期间每 10 分钟提交一次。
# 对比"每 10 分钟触发一次"：构建次数 2016 → 约 56 次，航迹分辨率反而更高（30 秒）。
#
# 额度依据（GitHub 官方文档）：
#   - 公有仓库 + 标准 GitHub-hosted runner = 免费无限分钟
#   - 私有仓库 GitHub Free 仅 2000 分钟/月；本方案 14 天需约 20160 分钟 → 不够
#   - 单个 job 最长 6 小时 → 这里设 5 小时（--max-minutes 300），留 1 小时余量
#
# cron 为 5 位（分 时 日 月 周），按 **UTC** 解释：
#   '0 */6 * * *'  = 每 6 小时一次（UTC）
#   注意：负载高时定时触发可能延迟；仓库 60 天无活动会停用定时任务。
#
# 只需在 Settings → Secrets and variables → Actions 配置 Repository secrets：
#   OPENSKY_CLIENT_ID
#   OPENSKY_CLIENT_SECRET
# 推送无需额外配置：脚本自动使用内置 GITHUB_TOKEN。

name: bth-adsb-collect

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:          # 允许手动点一次立即验证

permissions:
  contents: write             # 必须，否则 GITHUB_TOKEN 无法推送数据

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Run long collector (5h @ 30s)
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_longrun.py --interval 30 --max-minutes 300 --commit-every 10
