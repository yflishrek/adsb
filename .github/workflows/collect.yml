# GitHub Actions —— BTH ADS-B 采集【已停用，仅保留为手动应急开关】
#
# ⚠️ 2026-10-12 起，采集已整体迁到腾讯云 SCF，数据存 COS。本工作流的 `schedule`
#    已移除，**不会再自动运行**；保留 `workflow_dispatch` 只作为手动应急手段
#    （例如 SCF 账号出问题时临时顶一下）。需要彻底删除时直接删本文件。
#
# 为什么弃用：GitHub 的 `schedule` 在这个仓库上丢事件约 90%。实测同为 30 分钟
# 周期，13.5 小时里只触发了 3 次（约 6% 覆盖），当天晚些时候又断了 3 小时以上。
# 问题在调度器而不在计算（公有仓库分钟数免费无限），换成别的 cron 写法也没用——
# `*/30` 和 `7,37` 都丢。SCF 的定时触发器没有这个失效模式。
#
# 如果要手动跑一次，注意它仍然按老逻辑把数据提交到本仓库（不是 COS）。
#
# cron 为 5 位（分 时 日 月 周），按 **UTC** 解释。
#
# 只需在 Settings → Secrets and variables → Actions 配置：
#   OPENSKY_CLIENT_ID
#   OPENSKY_CLIENT_SECRET
# 推送无需额外配置：脚本自动使用内置 GITHUB_TOKEN。

name: bth-adsb-collect

on:
  # schedule 已移除：定时触发不可靠，采集改由腾讯云 SCF 承担。
  # 原配置（供参考）：- cron: '7,37 * * * *'
  workflow_dispatch:          # 仅手动触发，应急用

permissions:
  contents: write             # 必须，否则 GITHUB_TOKEN 无法推送数据

concurrency:
  # 同一时刻只允许一个采集器。用 queue 而不是 cancel：只有等当前 job 正常
  # 结束后下一个才启动，避免两个进程同时写同一个 DATA_BATCH 文件。
  group: bth-adsb-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # 兜底：正常情况下 26 分钟结束，超时直接杀掉，免得占着 concurrency 槽位。
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Run collector (26m @ 30s, commit every 10m)
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_REF_NAME / GITHUB_RUN_ID are provided by Actions automatically.
          # The collector needs them: REF_NAME because a CI checkout is DETACHED
          # (rev-parse returns literal "HEAD", which silently breaks push), and
          # RUN_ID to name each commit window's files uniquely so concurrent
          # runs can never collide on the same CSV.
        run: python scripts/collect_longrun.py --interval 30 --max-minutes 26 --commit-every 10
