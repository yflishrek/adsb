# 数据新鲜度告警 ——【已停用】
#
# ⚠️ 2026-10-12 起采集迁到腾讯云 SCF、数据存 COS。本 workflow 通过"最近一次改动
#    `data/flights/` 的提交有多旧"来判断存活，而这条链路已经不再产生新数据，
#    因此它会**持续误报**（数据永远"陈旧"）。`schedule` 已移除，仅保留手动开关。
#
# 存活检查现在应该对着真实的数据存储做：
#
#     python scripts/check_freshness.py --cos
#
# 对象键里带着批次时间戳（`opensky_20261012_053012_scf.csv`），所以最新的键就是
# 采集是否在跑的直接度量，不需要额外的 API 字段。

name: bth-adsb-health

on:
  # schedule 已移除：见上面的说明。原配置：- cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bth-adsb-health
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (history for data commits)
        uses: actions/checkout@v4
        with:
          # 需要够深的历史才能看到 data/flights/ 的提交；代码提交混在数据提交
          # 之间，50 条足够覆盖最近数小时。
          fetch-depth: 50

      - name: Check data freshness (legacy git mode)
        run: python3 scripts/check_freshness.py --max-age-min 40 --report
